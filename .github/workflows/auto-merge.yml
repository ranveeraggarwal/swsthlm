name: Auto-merge pull requests

# Queue every non-draft PR for squash auto-merge. GitHub still waits for all
# required checks and reviews configured by the repository's branch rules.
# pull_request_target keeps this workflow on the trusted base branch.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  queue:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Queue squash auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --auto --squash